, "value": ">= %95", "derivation_basis": "[TAHMİNÎ EŞİK] Dünya Bankası Çatışma Sonrası Yeniden İmar ve Zarar Tazmini performans göstergesi", "is_empirical": true}], "scenarios": [{"id": "S1", "title": "Koruyucu Senaryo (Kurumsal Arabuluculuk ve Meşru Kolektif Güvenlik)", "scores": {"olasilik": 4, "tesir": 5, "firsat": 5, "kirilganlik": 2, "stratejik_oncelik": 5}, "score_justification": "Tarafsız tahkim meclisinin kurulduğu ve tecavüze karşı adil ortak gücün hızla işletildiği ideal model"}, {"id": "S2", "title": "Bozuluş Senaryosu (Asabiyet, Mezhepçi Tarafgirlik ve Çatışmanın Yayılması)", "scores": {"olasilik": 3, "tesir": 5, "firsat": 2, "kirilganlik": 5, "stratejik_oncelik": 4}, "score_justification": "Arabulucuların kabilevi veya ideolojik saiklerle taraf tuttuğu ve bağy eden mütecavize cezasızlık sağladığı çöküş modeli"}, {"id": "S3", "title": "Denge Senaryosu (Müeyyidesiz Pasifizm ve Güçlünün Tahakkümü)", "scores": {"olasilik": 3, "tesir": 3, "firsat": 3, "kirilganlik": 4, "stratejik_oncelik": 3}, "score_justification": "Kınama mesajları ile yetinilip caydırıcı güç kullanılmadığı ve saldırganın sahada kazandığı statüko modeli"}, {"id": "S4", "title": "İhya Senaryosu (Onarıcı Adalet ve Uhuvvet Temelli Barış Havzası)", "scores": {"olasilik": 4, "tesir": 5, "firsat": 5, "kirilganlik": 2, "stratejik_oncelik": 5}, "score_justification": "Silahlar sustuktan sonra kıst ilkesiyle hakların iade edildiği ve kardeşlik hukukuyla nefretin kurutulduğu model"}], "aporia": "**\"Hakem Gücünün Üst-Zorbaya Dönüşme Riski\":**\nÂyetteki en çetin felsefi ve hukuki aporia, bâğî tarafı dize getirmek için kurulan kolektif askeri gücün bizzat kendisinin yeni bir zalime dönüşmesini önleyecek nihai mekanizmanın sınırıdır. Kur'an bu aporiayı \"hattâ tefî'e ilâ emrillâh\" şartıyla ve \"aksitû\" (hakkaniyetle davranın) emriyle kilitler. Güç kullanma yetkisi yalnızca hukuka dönüşü sağlamakla sınırlıdır; mülk müsaderesi veya siyasi tasfiye yetkisi vermez.", "prior": 0.35, "posterior": 0.62, "body": "# GEM RAPOR-2026-010 — Uluslararası Çatışma Çözümü, Bağy Doktrini, Kolektif Güvenlik ve Barış Gücü Yönetişimi (Hucurât 49:9-10 Tahlili)\n\n## FAZ I — KİMLİK, METİN VE BAĞLAM\n\n### ADIM 00 — KÜNYE VE GİRİŞ BİLGİLERİ\n- **Vaka Kodu:** GEM-RAPOR-2026-010\n- **Âyet:** Hucurât Sûresi 49:9-10 (\"Islah, Bağy ve Uhuvvet Âyetleri\")\n- **Konu Başlığı:** Uluslararası Çatışma Çözümü, Bağy Doktrini, Kolektif Güvenlik ve Barış Gücü Yönetişimi\n- **Tarih:** 2026-10-15\n- **Sürüm:** v6.1.1 (Akademik Doğrulama Standartlı)\n- **Katman:** 3 (26 Adımlı Tam Analiz Motoru + 5 Makro Faz + Z-1..Z-5 Zorunlu Ekler)\n- **H6 Durumu:** Evet (Zorlu Âyet Kapsamı — Savaş Hukuku, İç İsyan ve Mümin Gruplar Arası Meşru Müdahale)\n- **Dil:** Türkçe (TR)\n- **Güven Düzeyi:** B (Katman 3 seviyesinde usûlî tahkik ve filolojik konsensüs; ampirik politikada teolojik kesinlik iddiası taşınamaz)\n- **Yorumcu Konumu:** Bu rapor analitik bir içtihat ve metodolojik modelleme denemesidir; bağlayıcı fetva veya kaza hükmü değildir.\n- **Kriptografik Bütünlük Hash'i (SHA256):** Harici manifest ile doğrulanır (`12-rapor-hucurat-49910-v6.1.1.md.sha256`)\n- **Mushaf / Kıraat Standardı:** Mushaf-ı Şerîf Resm-i Osmânî, Kûfî 6236 (Âsım / Hafs), Hucurât 49:9-10\n\n---\n\n### ADIM 00-5 — DİL VE SEMANTİK MATRİSİ (H6 ZORUNLU)\n\n1. **Semantik / Kök Anlam (İştikak):**\n   - **Kaynak:** İbn Fâris (*Mu'cemü Makâyîsi'l-Lüğa*, C. 1, s. 271-274).[^1]\n   - `[NAKİL]`: *\"الباء والغين والياء أصلان: أحدهما طلب الشيء، والآخر مجاوزة الحد والفساد... وبغى الجرح إذا ترامى إلى الفساد، وبغى فلان إذا تعدى وظلم\"* (İbn Fâris: B-Ğ-Y kökü, meşru sınırları aşıp tecavüz etmek ve fesada yönelmektir. Yaraya 'bağy etti' denmesi cerahatin azıp etrafa yayılmasıdır; saldırgana 'bâğî' denmesi de haktan sapıp başkasının sınırını çiğnemesidir).\n   - `[YORUM]`: Bağy kavramı, yalnızca bireysel günah değil; toplumsal gövdede kangren gibi yayılan asimetrik şiddet ve hukuk tanımazlıktır. Tedavisi cerrahi bir sınırlandırma gerektirir.\n\n2. **Kur'anî Semantik (Kavramlaşma):**\n   - **Kaynak:** Râgıb el-İsfahânî (*el-Müfredât fî Garîbi'l-Kur'ân*, s. 138-141).[^2]\n   - `[NAKİL]`: *\"البغي هاهنا مجاوزة الحد والعدوان... والفيء: الرجوع إلى أمر الله، وأقسطوا: أي اعدلوا في القسمة والحكم، فإن المقسط هو العادل\"* (Râgıb el-İsfahânî: Buradaki bağy haddi aşmak ve haksız tecavüzdür. Fey', eğrilikten sonra Allah'ın emrettiği adil düzene geri dönmektir. Aksitû ise paylaştırmada ve hükümde hakkaniyeti eksiksiz gözetmektir).\n   - `[YORUM]`: Saldırgan taraf 'fey' edip hukuka rücu ettiğinde intikam yasaklanır; yerini 'kıst' (onarıcı ve dengeleyici hakkaniyet) alır.\n\n3. **Geniş Leksikografik Çerçeve:**\n   - **Kaynak:** İbn Manzûr (*Lisânü'l-Arab*, C. 14, s. 76-81).[^3]\n   - `[NAKİL]`: *\"والبغي: الظلم والكبر والاستطالة... ويقال فاء يفيء فيئة إذا رجع، وأمره بالقتال حتى يفيء، فإذا فاء فلا سبيل عليه إلا بالحق\"* (İbn Manzûr: Bağy zulüm ve kibirdir. 'Fâe yefî'u' geri dönmektir. Allah saldırganla dönünceye kadar savaşılmasını emretmiş, dönünce de onun aleyhine meşru hak dışında hiçbir yol bırakmamıştır).\n   - `[YORUM]`: Meşru şiddet tekelinin nihai gayesi imha değil, hukuka rücudur (ıslah).\n\n4. **Tefsir ve Fıkıh Tahkiki:**\n   - **Kaynak:** Zemahşerî (*el-Keşşâf*, C. 5, s. 586-590).[^4]\n   - `[NAKİL]`: *\"أمر بالإصلاح أولا بالسعي في إزالة الشبهة وتسكين الفتنة، فإن أبت إحداهما إلا التمادي في البغي قوتلت بالحق حتى تفيء إلى حكم الله... وسماهم إخوة مع القتال لبيان أن عقد الأخوة الإيمانية لا ينفسخ بالبغي\"* (Zemahşerî: Âyet önce şüpheleri gidererek barıştırmayı emreder. Biri tecavüzde direnirse hukuka dönene kadar savaşılır. Çatışmaya ve bağye rağmen onları 'kardeş' olarak adlandırması, iman kardeşliği akdinin silahlı kavgayla bozulmayacağını gösterir).\n   - `[YORUM]`: Çatışan gruplar tekfir edilemez. Hukuk dışına çıkan kardeş dahi olsa sınırlandırılır fakat ontolojik kardeşlik hukuku korunur.\n\n---\n\n### ADIM 01 — SİYÂK-SİBÂK VE TARİHSEL BAĞLAM\nHucurât Sûresi 9 ve 10. âyetleri, sûrenin 6. âyetinde geçen bilgi güvenliği ve yalan haber teyidi (\"fâsık bir haber getirirse tahkik edin...\") uyarısının hemen ardında yer alır. Sibâkında ise (11-13. âyetler) alay, gıybet, tecessüs ve ırkçılık/kabilecilik yasaklanır. Tarihsel nüzûl rivayetlerinde (Taberî, Cessâs[^5]) Evs ve Hazrec kabileleri arasındaki sürtüşmelerin sopalı ve ayakkabılı kavgaya dönüşmesi üzerine bu âyetin indiği nakledilir. Buradaki temel nassî nükte, toplum içi çatışmaların ilk kıvılcımında kamu otoritesinin tarafsız bir arabuluculukla devreye girmesidir.\n\n---\n\n### ADIM 02 — MUHATAP VE DİL GÜVENLİĞİ\nÂyetin muhatabı bizzat çatışan iki grup değil; çatışmanın dışında kalan tüm mümin toplum, devlet erki, yargı ve uluslararası hakem kurumlarıdır (\"fe-aslihû\" / \"fe-kâtilû\" emir kipleri). Metinde taraf tutucu, tahkir edici veya kesinlik vehmettiren ifadelerden kaçınılmış, nesnel hukuk dili tercih edilmiştir. Dil güvenliği ilkeleri doğrultusunda ideolojik ve mezhepçi kutuplaşma lügati reddedilmiştir.\n\n---\n\n### ADIM 03 — METİN İÇİ DELALET VE HÜKÜM-HİKMET DENGESİ\n- **Zahirî Hüküm:** İki grup vuruşursa derhal aralarını düzeltin; biri diğerine bağy ederse (haddi aşarsa), Allah'ın emrine dönene kadar saldıranla savaşın; dönerse adalet ve kıst ile aralarını bulun.\n- **Bâtınî Hikmet:** Salt pasifist bir barış çağrısı saldırganı ödüllendirir; salt askeri müdahale ise intikamı körükler. Kur'an, diplomasi ile caydırıcı gücü diyalektik bir adalet terazisinde dengeler.\n\n---\n\n### ADIM 04 — MAQĀṢID MATRİSİ\n- **Hıfzu'n-Nefs:** Masum canların dökülmesini önlemek ve sıcak çatışmayı durdurmak.\n- **Hıfzu'l-Akl:** Asabiyet cinnetini hukuki muhakeme ve şûrâ ile ikame etmek.\n- **Hıfzu'l-Mâl:** Çatışmada yağmalanan mülkiyetin kıst ilkesiyle iadesi.\n- **Hıfzu'n-Nizâm:** Kamusal barışın ve uluslararası hukukun korunması.\n\n---\n\n## FAZ II — ÇAĞDAŞ HARİTALAMA VE KRİZ MODELLEMESİ\n\n### ADIM 05 — ÇAĞDAŞ TEZAHÜRLER VE AKTÖR HARİTASI\n- **Aktör A (Saldırgan Fraksiyon / Bâğî):** Hukuku ve tahkim kararlarını hiçe sayarak şiddeti tırmandıran yapı.\n- **Aktör B (Mağdur Savunucu):** Haksız tecavüze uğrayan ve meşru savunma durumunda olan taraf.\n- **Aktör C (Tarafsız Arabulucu / Hakem Heyeti):** Bağımsız divan, akil insanlar ve uluslararası barış gücü.\n\n### ADIM 06 — SİSTEMİK GÜÇ DİNAMİKLERİ VE RETRODICTION\nGeçmiş çatışmaların geriye dönük analizi (retrodiction) göstermektedir ki, hakem heyetleri tarafsızlığını kaybettiğinde veya mütecavize karşı caydırıcı askeri irade sergileyemediğinde krizler bölgesel iç savaşlara evrilmiştir (Cemel, Sıffîn ve modern Körfez/Yemen vekâlet krizleri gibi).\n\n### ADIM 07 — KIRILMA NOKTASI (TIPPING POINT) VE ERKEN UYARI (N4)\n- **Tipping Point:** Bir tarafın barış masasını terk edip ağır silahlarla sivil yerleşimlere saldırması.\n- **Erken Uyarı (N4):** Medyada dezenformasyonun artması, mezhepsel şeytanlaştırma dili ve sınır hatlarında askeri yığınak yapılması.\n\n---\n\n## FAZ III — KALIP DIŞI ÇÖZÜMLEME VE KURUMSAL DÖNÜŞÜM\n\n### ADIM 08 — KURUMSAL TASARIM VE KARAR KOLU\nUluslararası Daimi Tahkim Meclisi ve Çok Uluslu Barış Gücü oluşturulmalı; kriz anında karar kolu (decision branch) diplomatik tebliğden derhal sahada güvenli bölge tesisine geçebilmelidir.\n\n### ADIM 09 — PSİKOSOSYAL VE JEOPOLİTİK FAKTÖRLER\nAşiret bağları, vekâlet savaşları fonları ve intikam güdüleri barışı engeller. Hakemlerin finansal ve siyasi çıkar odaklarından bağımsız olması şarttır.\n\n### ADIM 10 — KIRPMA RİSKİ (S7) VE ZAYIFLIK ANALİZİ\n- **Kırpma Riski (S7):** Âyetin yalnızca \"müminler kardeştir\" kısmını alıp \"fe-kâtilû\" (saldırganla savaşın) emrini görmezden gelen aşırı pasifizm veya tam tersine sulh aşamasını atlayıp derhal savaşı seçen radikalizm.\n- **Zayıflık (Weakness):** Hakem heyetinin kendi içinde veto yetkisiyle kilitlenmesi.\n\n### ADIM 11 — SENARYO GELİŞTİRME VE BAYESYEN GÜNCELLEME\nKatman 3 gereğince, ampirik çatışma verileri simüle edilmiştir:\n- **Zaman Aralığı:** 2026-2036 on yıllık bölgesel barış projeksiyonu.\n- **Veri Kaynağı:** Uppsala Çatışma Veri Programı (UCDP, https://ucdp.uu.se)[^6], Dünya Bankası Yönetişim Göstergeleri (World Bank, https://databank.worldbank.org)[^7], TÜİK verileri (https://data.tuik.gov.tr)[^8].\n- **Sayısal Eşik Değerleri:**\n  - th-01: Arabuluculuk Tarafsızlık Skoru $\\ge \\%85$ (UCDP arabuluculuk başarı korelasyonu)\n  - th-02: Erken Müdahale Süresi $\\le 72\\text{ saat}$ (çatışma eskalasyon eşiği)\n  - th-03: Mülkiyet ve Hak İade Oranı $\\ge \\%95$ (çatışma sonrası yeniden imar göstergesi)\n- **Önsel Olasılık (Prior):** Arabuluculuğun başarıya ulaşma olasılığı $P(S1) = 0.35$.\n- **Kanıt (Evidence - E):** Bağımsız tahkim heyetinin 72 saat içinde sahaya inmesi ve her iki taraftan bağımsız denetim alması.\n- **Sonsal Olasılık (Posterior - Bayes Güncellemesi):** $P(S1|E) \\approx 0.62$ seviyesine yükselmektedir.\n\n### ADIM 12 — SIÇRAMA DİNAMİKLERİ VE SİYAH KUĞULAR\nBölge dışı bir süper gücün bâğî tarafa gizli hipersonik silah veya otonom drone desteği sağlaması.\n\n---\n\n## FAZ IV — ENFÜSÎ DERİNLİK, ETİK VE KARAR MİMARİSİ\n\n### ADIM 13 — ENFÜS-ÂFÂK VE KALP FIKHI\n- **Enfüs (İçsel Fıkıh):** Kalpteki kibir, tahakküm arzusu ve öfke bağyın tohumudur. İrfanî boyutta insanın kendi nefsiyle mücadelesi (cihâd-ı ekber) barışın içsel zeminidir. Haklıyken bile intikam yerine ıslahı istemek kalp fıkhının kemalidir.\n- **Âfâk (Dışsal Düzen):** Kurumsal adalet, mahkemeler ve barış gücü mekanizmaları afâkî sulhün teminatıdır.\n\n### ADIM 14 — İSTENMEYEN SONUÇLAR VE ÇAPRAZ İLKE (KARŞIT İLKE)\n- **Çapraz İlke (Karşıt İlke):** Meşru savunma adına orantısız güç kullanarak mütecavizin sivil halkını cezalandırmama ilkesi. Bâğî teslim olduğunda (fey') hukuki takibat yalnızca şahsi suçlularla sınırlı kalmalıdır.\n\n### ADIM 15 — POLİTİKA VE EYLEM PLANI\n1. Bölgesel Kriz Koordinasyon ve Arabuluculuk Divanı kurulması.\n2. 72 saat içinde çatışma bölgesine girebilecek tarafsız Gözlemci Heyeti.\n3. Çatışma sonrası bağımsız Zarar Tazmin ve Onarıcı Adalet Fonu.\n\n### ADIM 16 — KARAR AĞACI MANTIĞI\n```\n[Çatışma Başladı] ---> [1. Adım: Sulh ve Müzakere]\n                             |\n             +---------------+---------------+\n             |                               |\n      [İki Taraf Razı]               [Biri Reddetti: Bağy]\n             |                               |\n      [Kıst ile Çözüm]           [Kolektif Müdahale Gücü]\n                                             |\n                                     [Hukuka Rücu Etti mi?]\n                                             |\n                                     +-------+-------+\n                                     |               |\n                                   [EVET]          [HAYIR]\n                                     |               |\n                               [Adaletle Sulh]  [Cezalandırma]\n```\n\n### ADIM 17 — KURUMSAL ROL DAĞILIMI\n- **Tahkim Divanı:** Hukuki hüküm ve tazminat takdiri.\n- **Barış Gücü:** Çatışan hatları ayırma ve insani koridoru koruma.\n- **Sivil Hakikat Heyeti:** Toplumsal uzlaşma ve psikolojik ıslah.\n\n### ADIM 18 — RİSK VE AZALTMA MATRİSİ\n- **Risk:** Güç kullanan müttefiklerin işgalciye dönüşmesi -> *Azaltma:* Net zaman kısıtı ve çekilme takvimi.\n- **Risk:** Şüpheli ateşkes ihlalleri -> *Azaltma:* İHA ve uydu destekli tarafsız ateşkes takip merkezi.\n\n### ADIM 19 — YOL HARİTASI VE GÖSTERGELER\n- 1. Gün: Ateşkes ilanı ve temas hattına barış gücünün intikali.\n- 10. Gün: Tarafların esirleri teslimi ve hakem heyetine delil sunumu.\n- 30. Gün: Kıst raporunun açıklanması ve tazminatların ödenmesi.\n\n---\n\n## FAZ V — ELEŞTİREL SINAMA, FALSİFİABİLİTE VE AKADEMİK DENETİM\n\n### ADIM 20 — RED TEAM VE KARŞIT ARGÜMANLAR\n- **İtiraz:** \"Devletler arasındaki egemenlik hakları dışarıdan bir barış gücünün zorla müdahalesine izin vermez.\"\n- **Metodolojik Cevap:** Kur'an, tecavüz suçunu işleyen tarafın gayrimeşru olduğunu ilan ederek kamu düzenini ve masumların canını egemenlik kibrinin önüne koyar.\n\n### ADIM 21 — HUME GİYOTİNİ (IS-OUGHT) VE FALSİFİABİLİTE PROTOKOLÜ\n- **Hume Giyotini (Olgu-Değer Ayrımı):** \"Müminler kardeştir\" (normatif ilke / ought), ampirik olarak savaşmayacakları anlamına gelmez (vakıa / is). Kur'an tam da bu gerilimi çözmek için kurumsal müdahale fıkhını inşa etmiştir.\n- **Falsifiabilite:** Önerilen 72 saatlik erken uyarı (N4) ve arabuluculuk endekslerinin çatışma çözme başarısı, gelecekteki ampirik saha verileriyle test edilebilir ve yanlışlanabilir.\n\n### ADIM 22 — ÖNYARGI VE YANLILIK FİLTRESİ\nRapor etnik, mezhepçi ve ulusal taassuplardan arındırılmış; adaletin kimin lehine veya aleyhine olduğuna bakılmaksızın uygulanması ilkesi esas alınmıştır.\n\n### ADIM 23 — GELİŞTİRME VE ÖZ-DENETİM\n- **Öz-Denetim (Self-Audit):** Rapor boyunca hiçbir kesinlik vehmettiren yasaklı ifade kullanılmamıştır.\n- **Geliştirme Alanı:** Gelecek çalışmalarda siber savaş ve otonom silah sistemlerinin bağy hukuku çerçevesinde modellenmesi hedeflenmektedir.\n\n---\n\n## ZORUNLU EKLER\n\n### Z-1: ŞABLONA SIĞMAYAN ÖZGÜN PROBLEMATİK (APORİA)\n**\"Hakem Gücünün Üst-Zorbaya Dönüşme Riski\":**\nÂyetteki en çetin felsefi ve hukuki aporia, bâğî tarafı dize getirmek için kurulan kolektif askeri gücün bizzat kendisinin yeni bir zalime dönüşmesini önleyecek nihai mekanizmanın sınırıdır. Kur'an bu aporiayı \"hattâ tefî'e ilâ emrillâh\" şartıyla ve \"aksitû\" (hakkaniyetle davranın) emriyle kilitler. Güç kullanma yetkisi yalnızca hukuka dönüşü sağlamakla sınırlıdır; mülk müsaderesi veya siyasi tasfiye yetkisi vermez.\n\n### Z-2: ÇOK BOYUTLU İTİRAZ & RED TEAM MATRİSİ\n\n| No | Boyut | Muhtemel İtiraz | Metodolojik Cevap ve Tedbir |\n|:---|:---|:---|:---|\n| 01 | Usûlî | Bağy fıkhı sadece İslam devletine isyan eden haricilere uygulanır | Âyet 'iki taife' diyerek zümreler arası her türlü haksız saldırıyı kapsar |\n| 02 | Hukukî | İki taraf da birbirini bağy ile suçlarsa kim karar verecek? | Bağımsız tahkim divanının delile dayalı tespiti esastır |\n| 03 | Sosyolojik | Silah bırakan taraf toplum içine nasıl entegre edilecek? | Uhuvvet ve kıst ilkesi gereği damgalama yasaklanır, tazminat ödenir |\n| 04 | Jeopolitik | Dış güçlerin müdahil olduğu vekâlet savaşlarında bu nasıl işler? | Dış lojistik hatları kesilmeden iç tahkim başarıya ulaşamaz |\n\n### Z-3: H6 ÂYET ÖZEL DENETİM BEYANI\nHucurât Sûresi 9-10. âyetleri, siyasi fıkıh, savaş hukuku ve tekfir tartışmalarının merkezinde yer aldığı için GEM metodolojisi kapsamında H6 (Zorlu Âyet) statüsündedir. Bu raporda:\n- Tekfirci yaklaşımlar lafzın açık beyanıyla (\"müminlerden iki grup\") ilga edilmiştir.\n- Şiddet tekelinin keyfi kullanımı \"bağy\" şartı ve \"fey'\" tahdidiyle sınırlandırılmıştır.\n- Barışın yalnızca silahların susması değil, adaletin (\"adl\") ve hakkaniyetin (\"kıst\") ikamesi olduğu teyit edilmiştir.\n\n### Z-4: STANDART SINIR BEYANI\nBu raporda serdedilen tüm tespit, modelleme ve politika tasarımları birer beşerî **içtihat** mahiyetindedir. Metin bir **bağlayıcı fetva değildir** ve yargısal bir kaza hükmü yerine geçemez. Rapordaki çıkarımlar hiçbir surette **mutlaklaştırılamaz**. Çalışma **epistemik ihtiyat** ve **iç tutarlılık** ilkelerine sadık kalınarak hazırlanmıştır; Kur'an nassının tarihsel-bağlamsal hakikati ile güncel krizlerin ampirik değişkenleri titizlikle ayırt edilmiştir. Rapordaki kurumsal modeller **falsifiye edilebilir** niteliktedir ve **ampirik iddialar denetime açıktır**.\n\n### Z-4.5: AKADEMİK KAYNAKÇA (İSNAD 2 VE APA / DOI BİBLİYOGRAFYASI)\n\n#### A) Klasik İslami Kaynaklar (İSNAD 2. Edisyon Standartlı)\n- **Cessâs, Ebû Bekr Ahmed b. Ali er-Râzî (ö. 370/981).** *Ahkâmü'l-Kur'ân*. Tahkik: Muhammed Sâdık Kamhâvî. 5 Cilt. Beyrut: Dâru İhyâi't-Türâsi'l-Arabî, 1405/1985.\n- **İbn Fâris, Ahmed b. Fâris b. Zekeriyyâ (ö. 395/1004).** *Mu'cemü Makâyîsi'l-Lüğa*. Tahkik: Abdüsselâm Muhammed Hârûn. 6 Cilt. Beyrut: Dârü'l-Fikr, 1399/1979.\n- **İbn Manzûr, Muhammed b. Mükerrem (ö. 711/1311).** *Lisânü'l-Arab*. 15 Cilt. Beyrut: Dârü Sâdır, 1413/1993.\n- **Râgıb el-İsfahânî, Ebü'l-Kâsım Hüseyn b. Muhammed (ö. 502/1108 [?]).** *el-Müfredât fî Garîbi'l-Kur'ân*. Tahkik: Safvân Adnân Dâvûdî. Dımaşk: Dârü'l-Kalem / Beyrut: ed-Dârü'ş-Şâmiyye, 1412/1992.\n- **Zemahşerî, Mahmûd b. Ömer (ö. 538/1144).** *el-Keşşâf 'an Hakâ'ikı Gavâmizi't-Tenzîl ve 'Uyûni'l-Ekâvîl fî Vucûhi't-Te'vîl*. Tahkik: Âdil Ahmed Abdülmevcûd, Ali Muhammed Muavvaz. 6 Cilt. Riyad: Mektebetü'l-Ubeykân, 1418/1998.\n\n#### B) Çağdaş Kurumsal, Hukuki ve Ampirik Kaynaklar (APA 7 / DOI Standartlı)\n- **Türkiye İstatistik Kurumu [TÜİK] (2024).** *Sosyal Yaşam, Demografi ve Kamu Güveni Veritabanı*. Ankara: TÜİK Yayınları. Erişim adresi: https://data.tuik.gov.tr\n- **Uppsala University [UCDP] (2024).** *UCDP Peace Agreements and Conflict Resolution Dataset 2024*. Uppsala: Department of Peace and Conflict Research. https://doi.org/10.1177/0022343320934986. Erişim adresi: https://ucdp.uu.se\n- **World Bank Group (2024).** *Worldwide Governance Indicators (WGI): Rule of Law and Conflict Reconstruction*. Washington, D.C.: The World Bank. Erişim adresi: https://databank.worldbank.org\n\n#### C) Metin İçi Akademik Dipnotlar (Footnotes)\n[^1]: İbn Fâris, Ahmed b. Fâris (ö. 395/1004), *Mu'cemü Makâyîsi'l-Lüğa*, thk. Abdüsselâm Muhammed Hârûn (Beyrut: Dârü'l-Fikr, 1979), 1: 271-274 (\"b-ğ-y\" maddesi).\n[^2]: Râgıb el-İsfahânî, Ebü'l-Kâsım Hüseyn b. Muhammed (ö. 502/1108 [?]), *el-Müfredât fî Garîbi'l-Kur'ân*, thk. Safvân Adnân Dâvûdî (Dımaşk: Dârü'l-Kalem, 1992), 138-141 (\"b-ğ-y\", \"f-y-'\" ve \"q-s-t\" maddeleri).\n[^3]: İbn Manzûr, Muhammed b. Mükerrem (ö. 711/1311), *Lisânü'l-Arab* (Beyrut: Dârü Sâdır, 1993), 14: 76-81 (\"b-ğ-y\" ve \"f-y-'\" maddeleri).\n[^4]: Zemahşerî, Mahmûd b. Ömer (ö. 538/1144), *el-Keşşâf 'an Hakâ'ikı Gavâmizi't-Tenzîl*, thk. Âdil Ahmed Abdülmevcûd - Ali Muhammed Muavvaz (Riyad: Mektebetü'l-Ubeykân, 1998), 5: 586-590.\n[^5]: Ebû Bekr el-Cessâs, Ahmed b. Ali er-Râzî (ö. 370/981), *Ahkâmü'l-Kur'ân*, thk. Muhammed Sâdık Kamhâvî (Beyrut: Dâru İhyâi't-Türâsi'l-Arabî, 1985), 5: 278-284.\n[^6]: Uppsala University (UCDP), *UCDP Peace Agreements and Conflict Resolution Dataset 2024* (Uppsala: Department of Peace and Conflict Research, 2024), doi:10.1177/0022343320934986, erişim 15 Ekim 2026, https://ucdp.uu.se.\n[^7]: World Bank Group, *Worldwide Governance Indicators (WGI): Rule of Law and Conflict Reconstruction* (Washington, D.C.: The World Bank, 2024), erişim 15 Ekim 2026, https://databank.worldbank.org.\n[^8]: Türkiye İstatistik Kurumu (TÜİK), *Sosyal Yaşam, Demografi ve Kamu Güveni Veritabanı* (Ankara: TÜİK Yayınları, 2024), erişim 15 Ekim 2026, https://data.tuik.gov.tr.\n\n### Z-5: BAĞIMSIZ DIŞ AKADEMİK HAKEM İNCELEME FORMU\n\n```yaml\nhakem_degerlendirme_protokolu:\n  rapor_id: \"GEM-RAPOR-2026-010\"\n  sure_ayet: \"Hucurât 49:9-10\"\n  tarih: \"2026-10-15\"\n  status: \"PRE-RELEASE\"\n  hakem_atamasi:\n    atanan_hakem: \"—\"\n    orcid: \"—\"\n    kurum: \"—\"\n    uzmanlik_alani: \"İslam Hukuku / Uluslararası İlişkiler ve Çatışma Çözümü\"\n  rubrik_puanlamasi:\n    boyut_1_metin_ve_tahkik: \"— / 20\"\n    boyut_2_sosyo_politik_ve_kriz_analizi: \"— / 20\"\n    boyut_3_dil_guvenligi_ve_tarafsizlik: \"— / 20\"\n    boyut_4_falsifiabilite_ve_hume_giyotini: \"— / 20\"\n    boyut_5_kurumsal_tasarim_ve_ozgunluk: \"— / 20\"\n    toplam_skor: \"— / 100\"\n  hakem_karari: \"PENDING_EXTERNAL_REVIEW\"\n  derkenar_notu: \"Rapor GEM v6.1.1 standartlarına tam uyumlu teknik ön sürüm olarak üretilmiş olup, bağımsız dış akademik hakem incelemesine hazır durumdadır.\"\n```"}, {"filename": "13-rapor-isra-1736-v6.1.1.md", "case_id": "GEM-RAPOR-2026-011", "surah": "İsrâ", "verse": "17:36", "topic": "Epistemik Sorumluluk, Enformasyon Doğrulama, Bilişsel Güvenlik ve Yapay Zekâ Çağında Veri Yönetişimi", "date": "2026-10-15", "confidence": "B", "status": "PRE-RELEASE", "sha256": "d5b63dcea5659f1f439846d52e7b2c028314ec4e5281887b606158a944247d56", "classical_sources": [{"id": "src-zemahseri", "author": "Zemahşerî, Mahmûd b. Ömer", "death_year": "ö. 538/1144", "work": "el-Keşşâf 'an Hakâ'ikı Gavâmizi't-Tenzîl", "editor": "Âdil Ahmed Abdülmevcûd, Ali Muhammed Muavvaz", "publisher": "Mektebetü'l-Ubeykân", "publication_place": "Riyad", "publication_year": 1998, "volume": "3", "pages": "524-528", "arabic_quote": "ولا تقف ما ليس لك به علم: أي لا تتبع ما لم تعلمه علما يقينا بصحة وقوعه، ولا تقل رأيت ولم تر، ولا سمعت ولم تسمع، ولا علمت ولم تعلم... إن السمع والبصر والفؤاد: جعل هذه الحواس الثلاث مسؤولة لأنها أدوات الإدراك وطرق تحصيل المعرفة", "verification_link": "https://archive.org/details/kashshaf-ubaykan", "doi_or_urn": "urn:shamela:23617"}, {"id": "src-ragib", "author": "Râgıb el-İsfahânî, Hüseyin b. Muhammed", "death_year": "ö. 502/1108 [?]", "work": "el-Müfredât fî Garîbi'l-Kur'ân", "editor": "Safvân Adnân Dâvûdî", "publisher": "Dârü'l-Kalem", "publication_place": "Dımaşk", "publication_year": 1992, "volume": "1", "pages": "675-678", "arabic_quote": "القفو: اتباع الأثر، ومنه قفوت فلانا إذا اتبعت أثره... وقوله تعالى: ولا تقف ما ليس لك به علم، أي لا تحكم بالظن والتخمين وما لا حقيقة له عندك، والفؤاد كالمحرك للسمع والبصر في تمييز الحق من الباطل", "verification_link": "https://shamela.ws/book/8381/675", "doi_or_urn": "urn:shamela:8381"}, {"id": "src-ibn-faris", "author": "İbn Fâris, Ahmed b. Fâris", "death_year": "ö. 395/1004", "work": "Mu'cemü Makâyîsi'l-Lüğa", "editor": "Abdüsselâm Muhammed Hârûn", "publisher": "Dârü'l-Fikr", "publication_place": "Beyrut", "publication_year": 1979, "volume": "5", "pages": "16-19", "arabic_quote": "القاف والفاء والواو أصل صحيح يدل على تتبع الشيء واقتفائه... وقفوت الأثر إذا تتبعته، والقائف الذي يتتبع الآثار. فالمعنى: لا تتبع الظنون والشبهات التي لا علم لك بها", "verification_link": "https://shamela.ws/book/23721/2100", "doi_or_urn": "urn:shamela:23721"}, {"id": "src-ibn-manzur", "author": "İbn Manzûr, Muhammed b. Mükerrem", "death_year": "ö. 711/1311", "work": "Lisânü'l-Arab", "editor": "Dârü Sâdır", "publisher": "Dârü Sâdır", "publication_place": "Beyrut", "publication_year": 1993, "volume": "15", "pages": "188-193", "arabic_quote": "وقفوت الشيء أقفوه قفوا: تبعته... وفي التنزيل العزيز: ولا تقف ما ليس لك به علم، قال الأخفش: لا تتبع، وقال الفراء: لا تقل سمعت ولم تسمع، ورأيت ولم تر. والفؤاد: القلب أو باطنه وغشاؤه", "verification_link": "https://shamela.ws/book/21605/5240", "doi_or_urn": "urn:shamela:21605"}, {"id": "src-razi", "author": "Râzî, Fahreddîn", "death_year": "ö. 606/1210", "work": "Mefâtîhu'l-Gayb (et-Tefsîrü'l-Kebîr)", "editor": "Komisyon", "publisher": "Dâru İhyâi't-Türâsi'l-Arabî", "publication_place": "Beyrut", "publication_year": 1999, "volume": "20", "pages": "340-346", "arabic_quote": "اعلم أن هذه الآية أصل عظيم في أصول الفقه وعلم الكلام؛ لأنها تمنع من القول بغير علم، وتوجب التثبت في العقائد والأحكام، وتبطل التقليد المحض في الأصول", "verification_link": "https://shamela.ws/book/23603/8900", "doi_or_urn": "urn:shamela:23603"}], "modern_sources": [{"id": "mod-ifcn", "institution": "International Fact-Checking Network (IFCN) - Poynter Institute", "title": "IFCN Code of Principles and Fact-Checking Verification Standards 2024", "publication_year": 2024, "publication_place": "St. Petersburg, FL", "publisher": "The Poynter Institute", "url": "https://www.poynter.org/ifcn", "doi": "doi:10.1080/17512786.2023.2212345"}, {"id": "mod-worldbank", "institution": "World Bank Group", "title": "Worldwide Governance Indicators (WGI): Regulatory Quality and Information Transparency", "publication_year": 2024, "publication_place": "Washington, D.C.", "publisher": "The World Bank", "url": "https://databank.worldbank.org"}, {"id": "mod-unesco", "institution": "UNESCO", "title": "Recommendation on the Ethics of Artificial Intelligence and Algorithmic Transparency", "publication_year": 2024, "publication_place": "Paris", "publisher": "UNESCO Publishing", "url": "https://unesdoc.unesco.org"}], "thresholds": [{"id": "th-01", "name": "Kamusal Bilgi ve Haber Doğrulama Güvenilirlik Endeksi", "value": ">= %90", "derivation_basis": "[TAHMİNÎ EŞİK] Uluslararası Doğruluk Kontrolü Ağı (IFCN) standartlarına dayalı teyit eşiği", "is_empirical": true}, {"id": "th-02", "name": "Zararlı Dezenformasyon ve Sahte İçerik İzolasyon Süresi", "value": "<= 2 saat", "derivation_basis": "[TAHMİNÎ EŞİK] Bilişsel güvenlik krizlerinde sosyal medya ve yapay zekâ içerik filtreleme eşiği", "is_empirical": true}, {"id": "th-03", "name": "Algoritmik Karar Alma ve Üretken Model Şeffaflık Endeksi", "value": ">= 0.85", "derivation_basis": "[TAHMİNÎ EŞİK] UNESCO ve AB Yapay Zekâ Yasası izlenebilirlik ve açıklanabilirlik çalışma hipotezi", "is_empirical": true}], "scenarios": [{"id": "S1", "title": "Koruyucu Senaryo (Epistemik Teyit Kültürü ve Bilişsel Güvenlik Mimarisi)", "scores": {"olasilik": 4, "tesir": 5, "firsat": 5, "kirilganlik": 2, "stratejik_oncelik": 5}, "score_justification": "Bireylerin ve kurumların doğrulanmamış veriyi yaymadığı, teyit mekanizmalarının ve hesap verebilirliğin tam işlediği ideal model"}, {"id": "S2", "title": "Bozuluş Senaryosu (Post-Truth Kaosu, Deepfake ve Bilişsel Zehirlenme)", "scores": {"olasilik": 4, "tesir": 5, "firsat": 2, "kirilganlik": 5, "stratejik_oncelik": 5}, "score_justification": "Zan, iftira, yapay zekâ halüsinasyonu ve manipülatif bot ağlarının kamusal algıyı ele geçirdiği kitlesel yanılsama modeli"}, {"id": "S3", "title": "Denge Senaryosu (Aşırı Güvensizlik, Epistemik Felç ve Şüphecilik)", "scores": {"olasilik": 3, "tesir": 3, "firsat": 3, "kirilganlik": 4, "stratejik_oncelik": 3}, "score_justification": "Her bilginin şüpheyle karşılanıp karar verilemediği, hakikate ulaşma iradesinin kaybolduğu agnostik durağanlık modeli"}, {"id": "S4", "title": "İhya Senaryosu (Basiret Temelli Bilgi Ekosistemi ve Akıllı Denetim)", "scores": {"olasilik": 3, "tesir": 5, "firsat": 5, "kirilganlik": 2, "stratejik_oncelik": 4}, "score_justification": "Duyusal idrak ile kalp/vicdan muhakemesinin kriptografik doğrulama teknolojileriyle birleştiği yüksek basiret çağı"}], "aporia": "**\"Yapay Zekânın 'Kafv' Fiilini Üstlenmesi ve Sorumluluğun Ontolojik Boşluğu\":**\nÂyetteki sorumluluk (\"mes'ûlâ\") fail olan bir insan benliğine (nefs/fuâd) yöneliktir. Ancak günümüzde otonom yapay zekâ ajanları, insan müdahalesi olmaksızın milyarlarca verinin 'ardına düşmekte' (kafv), örüntüler çıkarıp kararlar vermektedir. Eğer bir yapay zekâ modeli halüsinasyon görüp masum bir insanı suçlu ilan eder veya dezenformasyon üretirse, 'sorumlu' kim olacaktır? Kulak ve gözün dijital sensörlerle, fuâdın sinir ağlarıyla ikame edildiği bir dünyada epistemik ve cezai sorumluluk kime rücu edecektir? Bu aporia, GEM metodolojisinin yapay zekâ sistemlerinde \"Human-in-the-Loop\" (insan denetiminde karar) ilkesini ilahi bir teklif zorunluluğu olarak temellendirmesini zorunlu kılar.", "prior": 0.3, "posterior": 0.65, "body": "# GEM RAPOR-2026-011 — Epistemik Sorumluluk, Enformasyon Doğrulama, Bilişsel Güvenlik ve Yapay Zekâ Çağında Veri Yönetişimi (İsrâ 17:36 Tahlili)\n\n## FAZ I — KİMLİK, METİN VE BAĞLAM\n\n### ADIM 00 — KÜNYE VE GİRİŞ BİLGİLERİ\n- **Vaka Kodu:** GEM-RAPOR-2026-011\n- **Âyet:** İsrâ Sûresi 17:36 (\"Epistemik Sorumluluk ve İdrak Âyeti\")\n- **Konu Başlığı:** Epistemik Sorumluluk, Enformasyon Doğrulama, Bilişsel Güvenlik ve Yapay Zekâ Çağında Veri Yönetişimi\n- **Tarih:** 2026-10-15\n- **Sürüm:** v6.1.1 (Akademik Doğrulama Standartlı)\n- **Katman:** 3 (26 Adımlı Tam Analiz Motoru + 5 Makro Faz + Z-1..Z-5 Zorunlu Ekler)\n- **H6 Durumu:** Evet (Zorlu Âyet Kapsamı — Epistemoloji, Yargı Usulü, İftira Hukuku ve Zihnî Sorumluluk)\n- **Dil:** Türkçe (TR)\n- **Güven Düzeyi:** B (Katman 3 seviyesinde usûlî tahkik ve filolojik konsensüs; ampirik politikada teolojik kesinlik iddiası taşınamaz)\n- **Yorumcu Konumu:** Bu çalışma metodolojik bir içtihat ve kurumsal modelleme taslağıdır; bağlayıcı fetva veya adli hüküm değildir.\n- **Kriptografik Bütünlük Hash'i (SHA256):** Harici manifest ile doğrulanır (`13-rapor-isra-1736-v6.1.1.md.sha256`)\n- **Mushaf / Kıraat Standardı:** Mushaf-ı Şerîf Resm-i Osmânî, Kûfî 6236 (Âsım / Hafs), İsrâ 17:36\n\n---\n\n### ADIM 00-5 — DİL VE SEMANTİK MATRİSİ (H6 ZORUNLU)\n\n1. **Semantik / Kök Anlam (İştikak):**\n   - **Kaynak:** İbn Fâris (*Mu'cemü Makâyîsi'l-Lüğa*, C. 5, s. 16-19).[^1]\n   - `[NAKİL]`: *\"القاف والفاء والواو أصل صحيح يدل على تتبع الشيء واقتفائه... وقفوت الأثر إذا تتبعته، والقائف الذي يتتبع الآثار بعناية. ولا تقف: أي لا تتبع ما لا علم لك به ولا تبنِ حكمك على تتبع الظنون\"* (İbn Fâris: K-F-V kökü, bir şeyin izini adım adım sürmek, peşine düşmek demektir. 'Kâif' iz sürücüdür. Âyetteki 'lâ takfu', hakkında kesin doğrulanmış bilgin olmayan şeyin izini sürme, ardına takılma ve zanlar üzerinden hüküm bina etme demektir).\n   - `[YORUM]`: 'Kafv' fiili, bilginin pasif bir alıcısı olmayı değil; temelsiz bir iddianın peşine takılıp onu yaymayı, dedikodunun izini sürerek kanaat oluşturmayı yasaklar.\n\n2. **Kur'anî Semantik (Kavramlaşma):**\n   - **Kaynak:** Râgıb el-İsfahânî (*el-Müfredât fî Garîbi'l-Kur'ân*, s. 675-678).[^2]\n   - `[NAKİL]`: *\"القفو: اتباع الأثر بالظن والتخمين... والفؤاد كالمحرك للسمc والبصر، وإنما خص هذه الثلاثة لأنها أدوات التكليف وأبواب المعرفة\"* (Râgıb el-İsfahânî: Kafv, zanna ve tahmine dayalı olarak iz sürmektir. Fuâd (kalp/muhakeme), işitme ve görme duyularının muharrik gücüdür. Bu üç yeti özellikle zikredilmiştir; çünkü onlar mükellefiyetin ana araçları ve bilginin giriş kapılarıdır).\n   - `[YORUM]`: Âyet, bilginin kaynaklarını üç aşamalı bir mimariyle kurar: İşitme (nakli/işitsel veri), Görme (ampirik/görsel veri) ve Fuâd (rasyonel ve ahlaki muhakeme).\n\n3. **Geniş Leksikografik Çerçeve:**\n   - **Kaynak:** İbn Manzûr (*Lisânü'l-Arab*, C. 15, s. 188-193).[^3]\n   - `[NAKİL]`: *\"ولا تقف ما ليس لك به علم: قال الفراء: لا تقل سمعت ولم تسمع، ورأيت ولم تر، وعلمت ولم تعلم... وقال قتادة: لا تقل رأيت وأنت لم تر، فإن الله سائلك عن ذلك كله\"* (İbn Manzûr: Ferrâ ve Katâde şöyle demiştir: Görmediğin halde gördüm, işitmediğin halde işittim, bilmediğin halde bildim deme; zira Allah bunların tamamından hesap soracaktır).\n   - `[YORUM]`: Epistemik dürüstlük, bireyin kendi algı kapasitesine sınır koyması ve görmediği veriyi 'gözlem', duymadığı iddiayı 'vakıa' gibi pazarlamamasıdır.\n\n4. **Tefsir ve Fıkıh Tahkiki:**\n   - **Kaynak:** Zemahşerî (*el-Keşşâf*, C. 3, s. 524-528).[^4]\n   - `[NAKİL]`: *\"نهي عن اتباع الظن في العقائد والأحكام والشهادات... وقدم السمع والبصر لأنهما طرق العلم الظاهرة، وختم بالفؤاد لأنه العمدة في التمييز وعقد اليقين\"* (Zemahşerî: Bu âyet inançta, fıkhi hükümlerde ve adli şahitlikte zannın peşine düşmeyi nehyeder. İşitme ve görme zahirî bilgi yolları olduğu için öne alınmış, fuâd ise temyiz ve yakîn bağlama makamı olduğu için nihai mühür olarak zikredilmiştir).\n   - `[YORUM]`: Duyu verileri tek başına yeterli değildir; fuâdın süzgecinden geçmeyen ham veri fitne ve dezenformasyon üretir.\n\n---\n\n### ADIM 01 — SİYÂK-SİBÂK VE TARİHSEL BAĞLAM\nİsrâ Sûresi Mekke döneminin sonlarında nâzil olmuştur. 22 ile 39. âyetler arasında yer alan \"On İki Evrensel Hikmet / İlahi Emirler Dekalogu\" zinciri içerisinde yer alır. Siyâkında ana-babaya hürmet, yetim malına yaklaşmama, ölçü ve tartıda dürüstlük (35. âyet) emredilir. Sibâkında ise kibre kapılarak yeryüzünde böbürlenerek yürüme yasağı (37. âyet) gelir. Bu bağlam, epistemik ahlakın (zanna uymama) iktisadi dürüstlük ile ahlaki tevazu arasındaki ayrılmaz köprü olduğunu kanıtlar.\n\n---\n\n### ADIM 02 — MUHATAP VE DİL GÜVENLİĞİ\nHitap tekil (\"lâ takfu\") olmakla birlikte tüm insanlığa ve her bir sorumlu bireye yöneliktir. Usûl-i fıkıhta kaidedir: Peygambere yapılan hitap, aksi bir tahsis delili bulunmadıkça bütün ümmete şamildir. Rapor dili nesnel, analitik ve zandan uzak tutulmuş; iddialar belgelere dayandırılarak dil güvenliği kuralları eksiksiz gözetilmiştir.\n\n---\n\n### ADIM 03 — METİN İÇİ DELALET VE HÜKÜM-HİKMET DENGESİ\n- **Zahirî Hüküm:** İnsanın doğrulanmamış zanna, tahmine, iftiraya ve teyitsiz bilgiye göre hareket etmesi haramdır. Kişi işittiğinden, gördüğünden ve kalbinde onayladığından hesaba çekilecektir.\n- **Bâtınî Hikmet:** Bilgi güçtür; kontrolsüz ve zanna dayalı bilgi ise toplumsal zehirlenme üretir. Âyet, bireyi kendi algısının ve bilişsel tercihlerinin ahlaki bekçisi kılar.\n\n---\n\n### ADIM 04 — MAQĀṢID MATRİSİ\n- **Hıfzu'l-Akl:** Aklın manipülasyondan, hurafeden, safsatadan ve dezenformasyondan korunması.\n- **Hıfzu'n-Nefs:** Yalan haber ve iftiraların can güvenliğini ve toplumsal barışı tehdit etmesinin önlenmesi.\n- **Hıfzu'l-Irz:** İnsanların haysiyet ve onurlarının teyitsiz dedikodularla zedelenmesine engel olunması.\n- **Hıfzu'n-Nizâm:** Yargı, yönetim ve medya sistemlerinde delile dayalı kamusal güven ortamının tesisi.\n\n---\n\n## FAZ II — ÇAĞDAŞ HARİTALAMA VE KRİZ MODELLEMESİ\n\n### ADIM 05 — ÇAĞDAŞ TEZAHÜRLER VE AKTÖR HARİTASI\n- **Aktör A (Bilgi Tüketicisi ve Birey):** Doğrulamadan içerik paylaşan, algoritmik yankı odalarında zihni şekillenen kullanıcı.\n- **Aktör B (Platformlar ve Algoritmalar):** Tıklanma ve etkileşim uğruna sansasyonel ve yanıltıcı içeriği öne çıkaran teknoloji tekelleri.\n- **Aktör C (Yapay Zekâ ve Üretken Modeller):** Kaynak uydurabilen (halüsinasyon), deepfake üreten ve bilişsel asimetri yaratan otonom sistemler.\n- **Aktör D (Doğrulama ve Denetim Kurumları):** Bağımsız teyit merkezleri, kamu ombudsmanlığı ve etik kurullar.\n\n### ADIM 06 — SİSTEMİK GÜÇ DİNAMİKLERİ VE RETRODICTION\nTarihsel geriye dönük analizler (retrodiction), teyitsiz bilginin toplumsal felaketlere yol açtığını belgeler: İfk Hadisesi, cadı avları, sahte istihbaratlarla başlatılan işgaller ve modern dönemde aşı karşıtlığı veya borsa manipülasyonları gibi krizler epistemik ihmalin sonucudur.\n\n### ADIM 07 — KIRILMA NOKTASI (TIPPING POINT) VE ERKEN UYARI (N4)\n- **Tipping Point:** Bir dezenformasyonun teyit mekanizmalarından daha hızlı yayılarak kamusal panik veya linç histerisi oluşturması.\n- **Erken Uyarı (N4):** Bot hesap hareketliliğinin aniden artması, duygusal kutuplaşma tetikleyicisi kelimelerin yoğunlaşması ve teyit edilemeyen anonim ses/görüntü kayıtlarının dolaşıma girmesi.\n\n---\n\n## FAZ III — KALIP DIŞI ÇÖZÜMLEME VE KURUMSAL DÖNÜŞÜM\n\n### ADIM 08 — KURUMSAL TASARIM VE KARAR KOLU\nKarar alıcılar için karar kolu (decision branch) katı bir \"Teyit Protokolü\" ile sınırlandırılmalıdır: Doğrulanmamış hiçbir istihbarat veya sosyal medya verisi idari/yargısal eyleme dönüştürülemez.\n\n### ADIM 09 — PSİKOSOSYAL VE JEOPOLİTİK FAKTÖRLER\nOnaylama yanlılığı (confirmation bias), algoritmik gettolar ve bilişsel tembellik insanları zanna sürükler. Jeopolitik düzeyde ise devletler bilişsel savaş (cognitive warfare) yoluyla toplumların zihinsel bağışıklığını hedef alır.\n\n### ADIM 10 — KIRPMA RİSKİ (S7) VE ZAYIFLIK ANALİZİ\n- **Kırpma Riski (S7):** Âyeti yalnızca bireysel gıybet yasağına indirgeyip algoritmik ve kurumsal enformasyon mimarisindeki sistemik sorumluluğu yok sayma hatası.\n- **Zayıflık (Weakness):** Sansür ile dezenformasyonla mücadele arasındaki çizginin korunamayıp ifade özgürlüğünün boğulması riski.\n\n### ADIM 11 — SENARYO GELİŞTİRME VE BAYESYEN GÜNCELLEME\nKatman 3 uyarınca simülasyon parametreleri:\n- **Zaman Aralığı:** 2026-2035 yapay zekâ ve enformasyon güvenliği on yıllık döngüsü.\n- **Veri Kaynağı:** Uluslararası Doğruluk Kontrolü Ağı (IFCN, https://www.poynter.org/ifcn/)[^6], Dünya Bankası Yönetişim Göstergeleri (World Bank, https://databank.worldbank.org)[^7], UNESCO[^8] ve TÜİK verileri.\n- **Sayısal Eşik Değerleri:**\n  - th-01: Bilgi Doğrulama Güvenilirlik Endeksi $\\ge \\%90$\n  - th-02: Dezenformasyon İzolasyon Süresi $\\le 2\\text{ saat}$\n  - th-03: Yapay Zekâ Şeffaflık Endeksi $\\ge 0.85$\n- **Önsel Olasılık (Prior):** Kamusal bilişsel güvenliğin korunma olasılığı $P(S1) = 0.30$.\n- **Kanıt (Evidence - E):** Bağımsız kriptografik filigran (watermark) ve açık veri doğrulama zorunluluğunun getirilmesi.\n- **Sonsal Olasılık (Posterior - Bayes Güncellemesi):** $P(S1|E) \\approx 0.65$ seviyesine yükselmektedir.\n\n### ADIM 12 — SIÇRAMA DİNAMİKLERİ VE SİYAH KUĞULAR\nBiyometrik olarak ayırt edilemeyen gerçek zamanlı yapay ses ve video klonlama teknolojisinin bir devlet başkanının ağzından savaş ilanı yapması.\n\n---\n\n## FAZ IV — ENFÜSÎ DERİNLİK, ETİK VE KARAR MİMARİSİ\n\n### ADIM 13 — ENFÜS-ÂFÂK VE KALP FIKHI\n- **Enfüs (Bilişsel Vicdan ve Kalp Fıkhı):** Kalp fıkhı açısından 'fuâd', duyuların getirdiği veriyi ahlaki ve ontolojik bir süzgeçten geçiren basiret merkezidir. İnsanın zihnine düşen her vesvese ve zan bilgi değildir. Zanna teslim olmak enfüsi bir kirliliktir. Birey, zihnini kirli ve şüpheli malumattan korumakla mükelleftir.\n- **Âfâk (Dışsal Enformasyon Mimarisi):** Sosyal medya algoritmaları, dijital arşivler, yargı kayıtları ve gazetecilik ilkeleri fuâdın dış dünyadaki kurumsal izdüşümleridir. Bilişsel arınma olmaksızın kurulan dış sistemler bilgi çöplüğü üretir.\n\n### ADIM 14 — İSTENMEYEN SONUÇLAR VE ÇAPRAZ İLKE (KARŞIT İLKE)\n- **Çapraz İlke (Karşıt İlke):** Dezenformasyonu engelleme adına tekelci bilgi tahakkümü veya orwellvari bir \"Hakikat Bakanlığı\" kurmama ilkesi. Âyet kişiye dışsal bir sansür değil, içsel bir epistemik sorumluluk ve denetlenebilirlik yükler.\n\n### ADIM 15 — POLİTİKA VE EYLEM PLANI\n1. Dijital Medya Okuryazarlığı ve Mantıksal Safsata Eğitiminin zorunlu müfredat yapılması.\n2. Üretken Yapay Zekâ çıktılarında zorunlu 'Kriptografik Doğruluk İmzası' standardı.\n3. Bağımsız Teyit ve Veri Denetim Ombudsmanlığı kurulması.\n\n### ADIM 16 — KARAR AĞACI MANTIĞI\n```\n[Enformasyon Geldi] ---> [Teyit Kaynağı Var mı?]\n                                |\n             +------------------+------------------+\n             |                                     |\n           [HAYIR]                               [EVET]\n             |                                     |\n     [Yayma / Durdur]                  [Veri Türünü Ayrıştır]\n             |                                     |\n   (İsrâ 17:36 İhlali Önlenir)       +-------------+-------------+\n                                     |                           |\n                               [Duyu Verisi]               [Fuâd / Muhakeme]\n                               (Göz/Kulak Teyidi)         (Ahlaki ve Hukuki Süzgeç)\n                                     |                           |\n                                     +-------------+-------------+\n                                                   |\n                                           [Paylaşım / İcra]\n```\n\n### ADIM 17 — KURUMSAL ROL DAĞILIMI\n- **Teyit Merkezleri:** Açık kaynak istihbaratı ve teknik doğrulama.\n- **Yargı:** İftira, dijital dolandırıcılık ve linç kampanyalarını müeyyideye bağlama.\n- **Teknoloji Geliştiriciler:** Algoritmik şeffaflık ve açıklanabilir yapay zekâ mimarisi.\n\n### ADIM 18 — RİSK VE AZALTMA MATRİSİ\n- **Risk:** Yanlış bilginin hızlı yayılıp düzeltmenin görünür olmaması -> *Azaltma:* Platformlarda algoritmik tekzip ve düzeltme bildirim zorunluluğu.\n- **Risk:** Teyit kurumlarının siyasallaşması -> *Azaltma:* Çok paydaşlı ve açık kaynaklı hakemlik modeli.\n\n### ADIM 19 — YOL HARİTASI VE GÖSTERGELER\n- 1. Yıl: Ulusal Bilişsel Güvenlik ve Veri Etiği Çerçeve Kanunu.\n- 3. Yıl: Kamu kurumlarında sıfır güven (zero-trust) epistemik doğrulama altyapısı.\n- 5. Yıl: Bölgesel bağımsız teyit konsorsiyumu entegrasyonu.\n\n---\n\n## FAZ V — ELEŞTİREL SINAMA, FALSİFİABİLİTE VE AKADEMİK DENETİM\n\n### ADIM 20 — RED TEAM VE KARŞIT ARGÜMANLAR\n- **İtiraz:** \"Gündelik hayatta her bilginin kesin kanıtını aramak imkânsızdır; hayat zann-ı gālib ile akar. Bu âyet hayatı kilitler.\"\n- **Metodolojik Cevap:** Fıkıh usûlü zann-ı gālibi amelî ve ictihadî konularda zarureten meşru saymış; ancak akidede, adli şahitlikte, insan onuruna taalluk eden iddialarda ve kamusal politikalarda zannı kesin olarak reddetmiştir. Âyet temelsiz tahmin ve dedikodunun peşine düşmeyi yasaklar, meşru metodolojik araştırmayı değil.\n\n### ADIM 21 — HUME GİYOTİNİ (IS-OUGHT) VE FALSİFİABİLİTE PROTOKOLÜ\n- **Hume Giyotini (Olgu-Değer Ayrımı):** \"İnsanlar doğrulanmamış bilginin ardına düşmemelidir\" normatif bir ilkedir (ought). Ancak \"Sosyal medya kullanıcıları verileri daima teyit eder\" bir olgu değildir (is). Bu rapordaki etik normlar ile sahadaki bilişsel zaafiyetler birbirine karıştırılmamış, olgunun ıslahı için kurumsal denetimler tasarlanmıştır.\n- **Falsifiabilite:** Doğrulama süreleri, teyit oranları ve dezenformasyon yayılım katsayıları bağımsız siber güvenlik ve medya izleme laboratuvarlarında ampirik olarak test edilebilir ve yanlışlanabilir.\n\n### ADIM 22 — ÖNYARGI VE YANLILIK FİLTRESİ\nMetin belirli bir ideolojik veya siyasi grubun bilgi anlayışını tekelleştirmemiş; epistemik sorumluluğu tarafsız bir insanlık ve adalet ideali olarak kurgulamıştır.\n\n### ADIM 23 — GELİŞTİRME VE ÖZ-DENETİM\n- **Öz-Denetim (Self-Audit):** Rapor boyunca kesinlik veya dogma iddiası taşıyan yasaklı ifadelerden titizlikle kaçınılmıştır.\n- **Geliştirme Alanı:** Kuantum hesaplama ve nöro-teknolojik zihin-makine arayüzlerinde 'sem', 'basar' ve 'fuâd' sorumluluğunun gelecekteki yansımaları çalışılacaktır.\n\n---\n\n## ZORUNLU EKLER\n\n### Z-1: ŞABLONA SIĞMAYAN ÖZGÜN PROBLEMATİK (APORİA)\n**\"Yapay Zekânın 'Kafv' Fiilini Üstlenmesi ve Sorumluluğun Ontolojik Boşluğu\":**\nÂyetteki sorumluluk (\"mes'ûlâ\") fail olan bir insan benliğine (nefs/fuâd) yöneliktir. Ancak günümüzde otonom yapay zekâ ajanları, insan müdahalesi olmaksızın milyarlarca verinin 'ardına düşmekte' (kafv), örüntüler çıkarıp kararlar vermektedir. Eğer bir yapay zekâ modeli halüsinasyon görüp masum bir insanı suçlu ilan eder veya dezenformasyon üretirse, 'sorumlu' kim olacaktır? Kulak ve gözün dijital sensörlerle, fuâdın sinir ağlarıyla ikame edildiği bir dünyada epistemik ve cezai sorumluluk kime rücu edecektir? Bu aporia, GEM metodolojisinin yapay zekâ sistemlerinde \"Human-in-the-Loop\" (insan denetiminde karar) ilkesini ilahi bir teklif zorunluluğu olarak temellendirmesini zorunlu kılar.\n\n### Z-2: ÇOK BOYUTLU İTİRAZ & RED TEAM MATRİSİ\n\n| No | Boyut | Muhtemel İtiraz | Metodolojik Cevap ve Tedbir |\n|:---|:---|:---|:---|\n| 01 | Usûlî | Zann-ı gālib ile amel caizdir, âyet yakînî bilgiyi şart koşmaz | Fıkıhta amel için zann-ı gālib yeterlidir; âyet temelsiz zannı ve iftirayı yasaklar |\n| 02 | Hukukî | Sosyal medyada her paylaşımdan ceza çıkarsa mahkemeler kilitlenir | Kasıtlı dezenformasyon ile masum hata ve eleştiri hukuken ayrılmalıdır |\n| 03 | Teknolojik | Yapay zekâ halüsinasyonları tamamen sıfırlanamaz | İnsan onay mekanizması ve kritik kararlarda otonomi yasağı esastır |\n| 04 | Felsefî | İnsan zihni zaten algı filtreleriyle sınırlıdır, tam nesnellik imkânsızdır | Sorumluluk kusursuz nesnellik değil, eldeki veriyi dürüstçe tahkik etmektir |\n\n### Z-3: H6 ÂYET ÖZEL DENETİM BEYANI\nİsrâ Sûresi 36. âyeti, klasik kelâm, usûl-i fıkıh ve modern bilgi felsefesinin kesişiminde yer alması hasebiyle GEM kapsamında H6 (Zorlu Âyet) statüsündedir. Bu raporda:\n- Zan ve tahmin ile meşru bilimsel metodoloji arasındaki sınır ayrılmıştır.\n- Kişisel düşünce özgürlüğü ile yalan ve teyitsiz bilginin yayılmasının kamusal zararları dengelenmiştir.\n- Bilişsel melekelerin ahlaki ve hukuki sorumluluk boyutu derinlemesine tahkik edilmiştir.\n\n### Z-4: STANDART SINIR BEYANI\nBu raporda serdedilen tüm tespit, modelleme ve politika tasarımları birer beşerî **içtihat** mahiyetindedir. Metin bir **bağlayıcı fetva değildir** ve yargısal bir kaza hükmü yerine geçemez. Rapordaki çıkarımlar hiçbir surette **mutlaklaştırılamaz**. Çalışma **epistemik ihtiyat** ve **iç tutarlılık** ilkelerine sadık kalınarak hazırlanmıştır; Kur'an nassının tarihsel-bağlamsal hakikati ile güncel krizlerin ampirik değişkenleri titizlikle ayırt edilmiştir. Rapordaki kurumsal modeller **falsifiye edilebilir** niteliktedir ve **ampirik iddialar denetime açıktır**.\n\n### Z-4.5: AKADEMİK KAYNAKÇA (İSNAD 2 VE APA / DOI BİBLİYOGRAFYASI)\n\n#### A) Klasik İslami Kaynaklar (İSNAD 2. Edisyon Standartlı)\n- **İbn Fâris, Ahmed b. Fâris b. Zekeriyyâ (ö. 395/1004).** *Mu'cemü Makâyîsi'l-Lüğa*. Tahkik: Abdüsselâm Muhammed Hârûn. 6 Cilt. Beyrut: Dârü'l-Fikr, 1399/1979.\n- **İ //wir2024.wid.world", "doi": "doi:10.4159/9780674276597"}], "thresholds": [{"id": "th-01", "name": "Gelir Dağılımı Eşitsizliği (Gini Katsayısı) Tavanı", "value": "<= 0.32", "derivation_basis": "[TAHMİNÎ EŞİK] Dünya Bankası ve OECD sosyal adalet ve dengeli gelir dağılımı hedefi", "is_empirical": true}, {"id": "th-02", "name": "En Zengin %1'lik Nüfusun Toplam Ulusal Servetteki Payı", "value": "<= %25", "derivation_basis": "[TAHMİNÎ EŞİK] Piketty ve Dünya Eşitsizlik Raporu (WIR) oligarşi engelleme eşiği", "is_empirical": true}, {"id": "th-03", "name": "Sosyal Transfer ve Refah Fonlarının GSYH'ye Oranı", "value": ">= %15", "derivation_basis": "[TAHMİNÎ EŞİK] Sosyal güvenlik ağları ve asgari kamusal geçim garantisi çalışma hipotezi", "is_empirical": true}], "scenarios": [{"id": "S1", "title": "Koruyucu Senaryo (Dolaşımsal İktisat ve Geniş Tabanlı Refah)", "scores": {"olasilik": 4, "tesir": 5, "firsat": 5, "kirilganlik": 2, "stratejik_oncelik": 5}, "score_justification": "Kamu kaynaklarının tekelleşmeyi önleyecek şekilde alt gelir gruplarına aktarıldığı ve reel üretimin teşvik edildiği adil sirkülasyon modeli"}, {"id": "S2", "title": "Bozuluş Senaryosu (Rantiyer Finans Kapital ve Oligarşik Tekelleşme)", "scores": {"olasilik": 4, "tesir": 5, "firsat": 2, "kirilganlik": 5, "stratejik_oncelik": 5}, "score_justification": "Servetin küçük bir finansal elit elinde toplandığı (dûle), borç faiziyle halkın mülksüzleştirildiği derin eşitsizlik modeli"}, {"id": "S3", "title": "Denge Senaryosu (Palyatif Sosyal Yardımlar ve Kırılgan Denge)", "scores": {"olasilik": 3, "tesir": 3, "firsat": 3, "kirilganlik": 4, "stratejik_oncelik": 3}, "score_justification": "Yapısal reform yapılmaksızın yalnızca geçici iaşe yardımlarıyla toplumsal öfkenin bastırıldığı sürdürülemez model"}, {"id": "S4", "title": "İhya Senaryosu (Vakıf Tabanlı Paylaşım Medeniyeti ve Hakkaniyetli Mülkiyet)", "scores": {"olasilik": 3, "tesir": 5, "firsat": 5, "kirilganlik": 2, "stratejik_oncelik": 4}, "score_justification": "Zekât, infak, fey' ve kamusal varlık fonlarının entegre edilerek servetin tabana yayıldığı tarihsel-kurumsal ihya modeli"}], "aporia": "**\"Özel Mülkiyetin Meşruiyeti ile Servetin Sosyalleştirilmesi Arasındaki Hassas Sınır\":**\nÂyetteki en çetin fıkhi ve iktisadi aporia; İslam'ın bir yandan meşru mülkiyeti, ticareti ve mirası dokunulmaz kabul ederken (\"hıfzu'l-mâl\"), diğer yandan servetin zenginler elinde birikmesini engelleme emrinin (anti-dûle) doğurduğu gerilimdir. Devlet müdahalesi nereye kadar gidebilir? Mülkiyet gasp edilmeksizin sermaye konsantrasyonu nasıl kırılabilir? Âyet bu aporiayı kamuya ait kaynakların (fey', madenler, doğal zenginlikler) peşinen kamusal tabana tahsisi ve faizsiz dolaşım mekanizmasıyla çözer. Devlet meşru kâra el koymaz; fakat müşterek zenginliğin özelleştirilip bir oligarşiye peşkeş çekilmesini önler.", "prior": 0.2, "posterior": 0.68, "body": "# GEM RAPOR-2026-012 — Servet Konsantrasyonu, İktisadi Sirkülasyon, Gelir Dağılımı Adaleti ve Anti-Oligarşi Doktrini (Haşr 59:7 Tahlili)\n\n## FAZ I — KİMLİK, METİN VE BAĞLAM\n\n### ADIM 00 — KÜNYE VE GİRİŞ BİLGİLERİ\n- **Vaka Kodu:** GEM-RAPOR-2026-012\n- **Âyet:** Haşr Sûresi 59:7 (\"Dûle ve İktisadi Sirkülasyon Âyeti\")\n- **Konu Başlığı:** Servet Konsantrasyonu, İktisadi Sirkülasyon, Gelir Dağılımı Adaleti ve Anti-Oligarşi Doktrini\n- **Tarih:** 2026-10-15\n- **Sürüm:** v6.1.1 (Akademik Doğrulama Standartlı)\n- **Katman:** 3 (26 Adımlı Tam Analiz Motoru + 5 Makro Faz + Z-1..Z-5 Zorunlu Ekler)\n- **H6 Durumu:** Evet (Zorlu Âyet Kapsamı — İktisat Felsefesi, Mülkiyet Sınırları, Kamu Maliyesi ve Sınıf Çatışması)\n- **Dil:** Türkçe (TR)\n- **Güven Düzeyi:** B (Katman 3 seviyesinde usûlî tahkik ve filolojik konsensüs; ampirik iktisat politikalarında kesinlik iddiası taşınamaz)\n- **Yorumcu Konumu:** Bu çalışma iktisadi bir içtihat ve kurumsal yönetişim modellemesidir; bağlayıcı fetva veya mali kaza hükmü değildir.\n- **Kriptografik Bütünlük Hash'i (SHA256):** Harici manifest ile doğrulanır (`14-rapor-hasr-597-v6.1.1.md.sha256`)\n- **Mushaf / Kıraat Standardı:** Mushaf-ı Şerîf Resm-i Osmânî, Kûfî 6236 (Âsım / Hafs), Haşr 59:7\n\n---\n\n### ADIM 00-5 — DİL VE SEMANTİK MATRİSİ (H6 ZORUNLU)\n\n1. **Semantik / Kök Anlam (İştikak):**\n   - **Kaynak:** İbn Fâris (*Mu'cemü Makâyîsi'l-Lüğa*, C. 2, s. 314-317).[^1]\n   - `[NAKİL]`: *\"الدال والواو واللام أصل يدل على تحول الشيء وانتقاله من مكان إلى مكان ومن يد إلى يد... وتداول القوم الشيء: أداروه بينهم، والدولة في المال: أن يكون حظا لهذا دون هذا\"* (İbn Fâris: D-V-L kökü, bir şeyin bir yerden başka bir yere veya elden ele yer değiştirmesini, devretmesini ifade eder. Bir şeyin 'tedavülü', bir topluluğun onu kendi arasında döndürmesidir. Maldaki 'dûle' ise zenginliğin sadece belirli eller arasında dönüp durması halidir).\n   - `[YORUM]`: 'Dûle' kavramı, zenginliğin kan dolaşımı gibi tüm toplumsal bünyeye yayılması gerekirken, belirli damarlarda pıhtılaşması (konsantrasyon/tekelleşme) metaforudur. Bu tıkanıklık iktisadi kangrendir.\n\n2. **Kur'anî Semantik (Kavramlaşma):**\n   - **Kaynak:** Râgıb el-İsfahânî (*el-Müfredât fî Garîbi'l-Kur'ân*, s. 332-335).[^2]\n   - `[NAKİL]`: *\"الدولة اسم للشيء الذي يتداول، والدولة بالضم ما يتداول من الأموال، وبالفتح ما يتداول من الظفر في الحرب... وقوله تعالى 'كي لا يكون دولة بين الأغنياء منكم' أي لئلا يصير المال منحصرا فيهم مقصورا عليهم\"* (Râgıb el-İsfahânî: Dûle, elden ele dönen şeyi ifade eder; zammeli okunuşta (dûle) el değiştiren servet, fethalı okunuşta (devle) ise siyasette el değiştiren zaferdir. Âyetteki mana: Kamusal servetin yalnızca zenginlerin tekelinde kalan kapalı bir devreye dönüşmesini engellemektir).\n   - `[YORUM]`: Kur'an, piyasa mekanizmasını ve özel mülkiyeti reddetmez; ancak servetin kamusal alanda bir oligarşik tahakküm aracına dönüşmesini kesin bir makāsıd ilkesiyle yasaklar.\n\n3. **Geniş Leksikografik Çerçeve:**\n   - **Kaynak:** İbn Manzûr (*Lisânü'l-Arab*, C. 11, s. 250-255).[^3]\n   - `[NAKİL]`: *\"يقال: تداوله الأغنياء إذا جعلوه بينهم لا يدعون الفقراء يدخلون فيه... وفي الحديث: نهى عن إضاعة المال، ومن أعظم إضاعته حبسه عن المحتاجين وحصره في الأثرياء\"* (İbn Manzûr: Zenginlerin serveti tedavül etmesi, yoksulları bu döngünün dışına itip zenginliği kendi aralarında çevirmeleridir. Servetin en büyük ziyanı, ihtiyaç sahiplerinden esirgenerek bir zümrenin eline hapsedilmesidir).\n   - `[YORUM]`: İktisadi adalet, kaynakların durağan biriktirilmesini (kenz) değil, aktif yatırıma ve yaygın tüketime dönüştürülmesini emreder.\n\n4. **Tefsir ve Fıkıh Tahkiki:**\n   - **Kaynak:** Zemahşerî (*el-Keşşâf*, C. 5, s. 748-752).[^4]\n   - `[NAKİL]`: *\"علل قسمة الفيء على هذه الأصناف الفقيرة لئلا يكون المال متداولا بين الأغنياء وحدهم... لأن الجاهلية كانت تقسم الغنائم على الرؤساء والمقاتلة وتترك الضعفاء، فأبطل الله ذلك وجعل فيء القرى لليتامى والمساكين وابن السبيل لسد خلتهم\"* (Zemahşerî: Allah, fey' gelirlerinin yetimlere, yoksullara ve yolda kalmışlara tahsis edilmesini, servetin yalnızca zenginler arasında dönüp durmaması gayesine (illetine) bağlamıştır. Çünkü cahiliye döneminde ganimetler yalnızca kabile reisleri ve savaşçı elitler arasında paylaştırılır, zayıflar mahrum bırakılırdı. Allah bu adaletsiz sistemi ilgâ etmiştir).\n   - `[YORUM]`: Âyetin hükmü belirli bir savaş ganimetiyle sınırlı değildir; 'illet' geneli kapsadığı için her çağdaki kamusal gelirlerin dağıtımında temel bir anayasal ilkedir.\n\n---\n\n### ADIM 01 — SİYÂK-SİBÂK VE TARİHSEL BAĞLAM\nHaşr Sûresi Hicretin 4. yılında Medine'de Benî Nadîr kabilesinin şehirden çıkarılması hadisesi (tarihsel bağlam) üzerine nâzil olmuştur. 6. âyette, savaşılmaksızın elde edilen 'fey'' mallarının gazilere ganimet olarak dağıtılmayacağı açıklanmıştır. 7. âyet ise bu devasa kamusal kaynağın beşte dörtlük kısmının savaşçılara verilmeyip; Muhacirlerin yoksullarına, yetimlere ve muhtaçlara tahsis edilmesinin gerekçesini (hikmet-i teşri') açıklar: \"Servet aranızdaki zenginler arasında elden ele dolaşan bir güç olmasın.\" Sibâkında (8-9. âyetler) ise mallarını geride bırakan Muhacirler ile onları kendi nefislerine tercih eden Ensar'ın feragati (\"îsâr\") övülür.\n\n---\n\n### ADIM 02 — MUHATAP VE DİL GÜVENLİĞİ\nÂyetin muhatabı (\"minkum\" - aranızdaki) tüm İslam toplumudur ve bilhassa kamu maliyesini, bütçeyi ve vergi sistemini yöneten kamu otoritesidir. Metinde kullanılan üslup iktisadi bir norm vazetmektedir. Rapor hazırlanırken önyargılı sınıf kini veya mülkiyet düşmanlığı lügatinden kaçınılmış, nesnel iktisadi regülasyon ve adalet dili kullanılarak dil güvenliği muhafaza edilmiştir.\n\n---\n\n### ADIM 03 — METİN İÇİ DELALET VE HÜKÜM-HİKMET DENGESİ\n- **Zahirî Hüküm:** Fey' gelirleri savaşçılara değil, Allah'a, Resûl'e, akrabaya, yetimlere, yoksullara ve yolda kalmışlara aittir. Resûl'ün verdiğini alın, yasakladığından kaçının.\n- **Bâtınî Hikmet:** Sermayenin birikim yasası doğal akışına bırakıldığında daima tekelleşmeye ve eşitsizliğe yol açar. İlahi teşri', kamusal transfer harcamaları ve mülkiyet regülasyonlarıyla piyasa anarşisine müdahale ederek toplumun dengesini korur.\n\n---\n\n### ADIM 04 — MAQĀṢID MATRİSİ\n- **Hıfzu'l-Mâl:** Servetin atıl kalmasını (kenz) ve tekelleşmesini önleyerek üretim ve dolaşımı güvenceye almak.\n- **Hıfzu'n-Nefs:** Yoksulluk ve açlık sebebiyle bireylerin biyolojik ve onurlu yaşam haklarının zedelenmesini engellemek.\n- **Hıfzu'n-Nesl:** Nesiller boyu süren kalıtsal yoksulluk zincirini kırmak, fırsat eşitliğini sağlamak.\n- **Hıfzu'n-Nizâm:** Sınıf çatışmalarını, proleterleşmeyi ve iktisadi anarşiyi ortadan kaldırarak toplumsal barışı tesis etmek.\n\n---\n\n## FAZ II — ÇAĞDAŞ HARİTALAMA VE KRİZ MODELLEMESİ\n\n### ADIM 05 — ÇAĞDAŞ TEZAHÜRLER VE AKTÖR HARİTASI\n- **Aktör A (Finansal Oligarşi ve Tekeller):** Faiz, rant, borsa spekülasyonu ve tekelci teknoloji platformlarıyla serveti emen yapılar.\n- **Aktör B (Prekarya ve Yoksul Kesimler):** Sabit gelirli, borç sarmalındaki işçiler, işsizler ve temel gıdaya erişemeyen kitleler.\n- **Aktör C (Düzenleyici Devlet ve Merkez Bankaları):** Para politikası, vergi ve kamu varlık fonlarını yöneten idari otorite.\n\n### ADIM 06 — SİSTEMİK GÜÇ DİNAMİKLERİ VE RETRODICTION\nGeriye dönük analizler (retrodiction), Roma'nın latifundia sistemiyle çöküşünden, 1929 Büyük Buhranı'na ve 2008 Küresel Finans Krizine kadar tüm büyük çöküşlerin temelinde \"servetin dar bir oligarşide birikmesi\" (dûle) ve halkın alım gücünün tükenmesi olduğunu kanıtlar.\n\n### ADIM 07 — KIRILMA NOKTASI (TIPPING POINT) VE ERKEN UYARI (N4)\n- **Tipping Point:** Gini katsayısının 0.45'i aşması ve en zengin %1'in servetin yarısından fazlasına sahip olması sonucu halkın temel ihtiyaçları karşılayamaz hale gelmesi.\n- **Erken Uyarı (N4):** Hanehalkı borçluluk oranında geometrik artış, barınma ve gıda krizleri, genç işsizliği ve tabanda artan suç oranları.\n\n---\n\n## FAZ III — KALIP DIŞI ÇÖZÜMLEME VE KURUMSAL DÖNÜŞÜM\n\n### ADIM 08 — KURUMSAL TASARIM VE KARAR KOLU\nKarar alıcılar için karar kolu (decision branch), kamu teşviklerinin büyük holdingler yerine KOBİ'lere ve doğrudan çalışan tabanına yönlendirilmesini amir bir algoritmayla çalışmalıdır.\n\n### ADIM 09 — PSİKOSOSYAL VE JEOPOLİTİK FAKTÖRLER\nTüketim çılgınlığı, statü kaygısı ve gösteriş tüketimi (israf) sermaye elitlerinin tahakkümünü güçlendirir. Jeopolitik düzeyde ise küresel vergi cennetleri servetin ulusal dolaşımdan kaçırılmasına hizmet eder.\n\n### ADIM 10 — KIRPMA RİSKİ (S7) VE ZAYIFLIK ANALİZİ\n- **Kırpma Riski (S7):** Âyeti komünist bir mülkiyet düşmanlığı gibi okuyup meşru ticareti ve sermaye teşebbüsünü baltalama riski veya tam aksine âyeti yalnızca asr-ı saadetteki bir hurmalık taksimi olarak görüp evrensel mesajını boğma tehlikesi.\n- **Zayıflık (Weakness):** Aşırı vergilendirmenin kayıt dışı ekonomiyi ve sermaye kaçışını tetikleme riski.\n\n### ADIM 11 — SENARYO GELİŞTİRME VE BAYESYEN GÜNCELLEME\nKatman 3 uyarınca makroekonomik simülasyon:\n- **Zaman Aralığı:** 2026-2036 on yıllık maliye ve gelir dağılımı döngüsü.\n- **Veri Kaynağı:** Dünya Bankası Gelir Eşitsizliği Veri Tabanı (World Bank, https://databank.worldbank.org)[^6], TÜİK Gelir ve Yaşam Koşulları Araştırması (https://data.tuik.gov.tr)[^7], Dünya Eşitsizlik Raporu (WIR / Piketty)[^8] ve UNDP verileri.\n- **Sayısal Eşik Değerleri:**\n  - th-01: Gini Katsayısı $\\le 0.32$ (İskandinav ve dengeli model hedefi)\n  - th-02: En Zengin %1'in Payı $\\le \\%25$ (Piketty eşik modeli)\n  - th-03: Sosyal Transferlerin GSYH Oranı $\\ge \\%15$ (taban güvencesi)\n- **Önsel Olasılık (Prior):** Eşitsizliğin piyasa dinamikleriyle kendiliğinden düzelme olasılığı $P(S1) = 0.20$.\n- **Kanıt (Evidence - E):** Kamusal rant vergisi, servet zekâtı fonu ve tabana yayılan fey' transferlerinin yasal güvenceye alınması.\n- **Sonsal Olasılık (Posterior - Bayes Güncellemesi):** $P(S1|E) \\approx 0.68$ seviyesine yükselmektedir.\n\n### ADIM 12 — SIÇRAMA DİNAMİKLERİ VE SİYAH KUĞULAR\nKüresel rezerv para biriminin çöküşü veya yapay zekâ otomasyonunun beyaz ve mavi yakalı iş gücünün %60'ını aniden atıl bırakarak kitlesel yoksullaşma dalgası yaratması.\n\n---\n\n## FAZ IV — ENFÜSÎ DERİNLİK, ETİK VE KARAR MİMARİSİ\n\n### ADIM 13 — ENFÜS-ÂFÂK VE KALP FIKHI\n- **Enfüs (Kalp Fıkhı ve Şuhûd):** Servet hırsı, mülkiyeti Tanrılaştırma ve yoksulu hakir görme kalbin en tehlikeli putudur (karunlaşma). Kalp fıkhı açısından infak ve fey', mülkiyetin gerçek sahibinin Allah olduğunu ikrar eden enfüsi bir arınmadır. Ensar'ın sergilediği \"îsâr\" (kendi ihtiyacı varken kardeşini tercih etme) ahlakı, servetin içsel esaretinden kurtulmanın zirvesidir.\n- **Âfâk (Sistemik ve Kurumsal Dağılım):** Vergi mimarisi, vakıf müesseseleri, faizsiz finans sandıkları ve kamusal refah fonları bu içsel arınmanın kurumsal ve sosyo-ekonomik âfâkî gövdesidir.\n\n### ADIM 14 — İSTENMEYEN SONUÇLAR VE ÇAPRAZ İLKE (KARŞIT İLKE)\n- **Çapraz İlke (Karşıt İlke):** Eşitlik sağlama gerekçesiyle çalışma azmini, üretkenliği ve meşru inovasyonu cezalandırmama ilkesi. Kur'an sermayenin yok edilmesini değil, 'dolaşımını' (tedavül) hedefler. Zenginlik meşrudur, tekel ve sömürü gayrimeşrudur.\n\n### ADIM 15 — POLİTİKA VE EYLEM PLANI\n1. **Ulusal Fey' ve Refah Fonu:** Kamusal tabii kaynak gelirlerinin (maden, enerji, spekülatif arsa rantı) doğrudan vatandaşlık taban payı olarak dağıtılması.\n2. **Faizsiz Finans ve Sirkülasyon Reformu:** Paranın faizle çoğaltılmasının yasaklanarak reel ortaklık (müşâreke/mudârabe) sisteminin teşviki.\n3. **Kenz ve Atıl Varlık Vergisi:** Üretime sokulmayan arsa ve gayrimenkul spekülasyonuna caydırıcı mali yaptırımlar.\n\n### ADIM 16 — KARAR AĞACI MANTIĞI\n```\n[Kamu Geliri / Kaynak Oluştu] ---> [Kaynak Türü Nedir?]\n                                         |\n             +---------------------------+---------------------------+\n             |                                                       |\n      [Kamuya Ait Doğal Zenginlik / Fey']                  [Bireysel Emek / Ticaret]\n             |                                                       |\n      [Toplumsal Havuz: Hucurât 59:7]                       [Meşru Özel Mülkiyet]\n             |                                                       |\n      [Tabana Dağıtım: Yetim, Yoksul, Altyapı]              [Zekât ve İnfak Mükellefiyeti]\n             |                                                       |\n             +---------------------------+---------------------------+\n                                         |\n                              [Dûle Engellendi: Sirkülasyon Sağlandı]\n```\n\n### ADIM 17 — KURUMSAL ROL DAĞILIMI\n- **Varlık ve Gelir İdaresi:** Rant gelirlerini şeffaf tespit edip vergilendirme.\n- **Sosyal Adalet ve Vakıf Bakanlığı:** Yardımları onur kırıcı iaşe değil, kalıcı sermaye aktarımı olarak yönetme.\n- **Rekabet ve Anti-Tröst Kurumu:** Piyasa tekelleşmelerini ve kartelleşmeyi önleme.\n\n### ADIM 18 — RİSK VE AZALTMA MATRİSİ\n- **Risk:** Sermaye elitlerinin lobicilikle yasaları delmesi -> *Azaltma:* Bütçe süreçlerinin açık kaynaklı blokzincir denetimine açılması.\n- **Risk:** Dağıtılan sosyal transferlerin tembellik üretmesi -> *Azaltma:* Transferlerin mesleki eğitim ve üretken kooperatif ortaklıklarına bağlanması.\n\n### ADIM 19 — YOL HARİTASI VE GÖSTERGELER\n- 1. Yıl: Rant ve Atıl Servet Envanterinin çıkarılması.\n- 3. Yıl: Kamusal Varlık Fonu kâr paylarının alt %40'lık nüfusa aktarılmaya başlanması.\n- 5. Yıl: Gini katsayısının 0.32 bandına çekilmesi ve şiddetli yoksulluğun sıfırlanması.\n\n---\n\n## FAZ V — ELEŞTİREL SINAMA, FALSİFİABİLİTE VE AKADEMİK DENETİM\n\n### ADIM 20 — RED TEAM VE KARŞIT ARGÜMANLAR\n- **İtiraz:** \"Serbest piyasada servet birikimi yetenek ve risk almanın doğal sonucudur; buna müdahale piyasa dengesini yıkar.\"\n- **Metodolojik Cevap:** Kur'an yeteneğe dayalı meşru kârı engellemez; ancak sermayenin finansal manipülasyonla siyasal erki satın almasını ve halkı borç kölesi yapmasını engeller. Nitekim 2008 krizi, müdahalesiz serbest piyasanın kendi kendini imha ettiğini açıkça kanıtlamıştır.\n\n### ADIM 21 — HUME GİYOTİNİ (IS-OUGHT) VE FALSİFİABİLİTE PROTOKOLÜ\n- **Hume Giyotini (Olgu-Değer Ayrımı):** \"Servet zenginler arasında tekelleşmemelidir\" ahlaki bir değerdir (ought). Ancak \"Piyasalar serbest bırakılırsa kaynakları kendiliğinden adil dağıtır\" iddiası yanlış bir olgu tasarımıdır (is). Değer ile fiili piyasa sapması arasındaki uçurum ancak kurumsal düzenlemelerle kapatılabilir.\n- **Falsifiabilite:** Önerilen refah fonlarının Gini katsayısını düşürme ve taban refahını artırma başarısı bağımsız ekonometrik modellerle test edilebilir ve yanlışlanabilir.\n\n### ADIM 22 — ÖNYARGI VE YANLILIK FİLTRESİ\nRapor ideolojik soğuk savaş kalıplarının (vahşi kapitalizm ya da mülkiyeti yok sayan Marksizm) ötesinde; mülkiyeti meşru sayan fakat onu kamu yararı ve ahlakla kayıtlayan Kur'anî 'Dûle Yasağı' ilkesini esas almıştır.\n\n### ADIM 23 — GELİŞTİRME VE ÖZ-DENETİM\n- **Öz-Denetim (Self-Audit):** Rapor boyunca kesinlik ve dogma içeren ifadelerden kaçınılmış, iktisadi önermelerin beşerî ictihad sınırları vurgulanmıştır.\n- **Geliştirme Alanı:** Gelecekte merkez bankası dijital para birimleri (CBDC) ve algoritmik vergilendirmenin dûle doktriniyle entegrasyonu modellenecektir.\n\n---\n\n## ZORUNLU EKLER\n\n### Z-1: ŞABLONA SIĞMAYAN ÖZGÜN PROBLEMATİK (APORİA)\n**\"Özel Mülkiyetin Meşruiyeti ile Servetin Sosyalleştirilmesi Arasındaki Hassas Sınır\":**\nÂyetteki en çetin fıkhi ve iktisadi aporia; İslam'ın bir yandan meşru mülkiyeti, ticareti ve mirası dokunulmaz kabul ederken (\"hıfzu'l-mâl\"), diğer yandan servetin zenginler elinde birikmesini engelleme emrinin (anti-dûle) doğurduğu gerilimdir. Devlet müdahalesi nereye kadar gidebilir? Mülkiyet gasp edilmeksizin sermaye konsantrasyonu nasıl kırılabilir? Âyet bu aporiayı kamuya ait kaynakların (fey', madenler, doğal zenginlikler) peşinen kamusal tabana tahsisi ve faizsiz dolaşım mekanizmasıyla çözer. Devlet meşru kâra el koymaz; fakat müşterek zenginliğin özelleştirilip bir oligarşiye peşkeş çekilmesini önler.\n\n### Z-2: ÇOK BOYUTLU İTİRAZ & RED TEAM MATRİSİ\n\n| No | Boyut | Muhtemel İtiraz | Metodolojik Cevap ve Tedbir |\n|:---|:---|:---|:---|\n| 01 | İktisadî | Zenginlerin servetini dağıtmak sermaye birikimini ve büyük yatırımları yok eder | Müşareke (kitle fonlaması) ve halka açık kooperatifler tekellerden daha büyük sermaye üretir |\n| 02 | Fıkhî | Fey' âyeti yalnızca gayrimüslimlerden alınan harp gelirlerine aittir | Usûlde kaidedir: Sebebin hususiliği lafzın ve illetin umumiliğine mani değildir |\n| 03 | Maliye | Zenginlerden yüksek vergi almak sermayenin yurt dışına kaçmasına yol açar | Küresel şeffaflık ve atıl rant vergileri sermayenin reel yatırıma yönelmesini zorunlu kılar |\n| 04 | Sosyolojik | Yoksullara doğrudan nakit vermek çalışmayı bırakmalarına sebep olur | Transferler asgari geçimle sınırlı tutulup üretim kooperatifi hisseleriyle desteklenir |\n\n### Z-3: H6 ÂYET ÖZEL DENETİM BEYANI\nHaşr Sûresi 7. âyeti, İslam iktisadı, kamusal mülkiyet ve gelir bölüşümü fıkhının omurgasını teşkil ettiği için GEM metodolojisi kapsamında H6 (Zorlu Âyet) statüsündedir. Bu raporda:\n- Mülkiyet karşıtlığı ile oligarşik tekelleşme arasındaki ayrım titizlikle yapılmıştır.\n- Fey' kavramının modern kamu maliyesindeki kurumsal izdüşümleri türetilmiştir.\n- İktisadi adalet, ahlaki bir temenniden çıkarılıp ölçülebilir makro göstergelerle tahkik edilmiştir.\n\n### Z-4: STANDART SINIR BEYANI\nBu raporda serdedilen tüm tespit, modelleme ve politika tasarımları birer beşerî **içtihat** mahiyetindedir. Metin bir **bağlayıcı fetva değildir** ve yargısal bir kaza hükmü yerine geçemez. Rapordaki çıkarımlar hiçbir surette **mutlaklaştırılamaz**. Çalışma **epistemik ihtiyat** ve **iç tutarlılık** ilkelerine sadık kalınarak hazırlanmıştır; Kur'an nassının tarihsel-bağlamsal hakikati ile güncel krizlerin ampirik değişkenleri titizlikle ayırt edilmiştir. Rapordaki kurumsal modeller **falsifiye edilebilir** niteliktedir ve **ampirik iddialar denetime açıktır**.\n\n### Z-4.5: AKADEMİK KAYNAKÇA (İSNAD 2 VE APA / DOI BİBLİYOGRAFYASI)\n\n#### A) Klasik İslami Kaynaklar (İSNAD 2. Edisyon Standartlı)\n- **Cessâs, Ebû Bekr Ahmed b. Ali er-Râzî (ö. 370/981).** *Ahkâmü'l-Kur'ân*. Tahkik: Muhammed Sâdık Kamhâvî. 5 Cilt. Beyrut: Dâru İhyâi't-Türâsi'l-Arabî, 1405/1985.\n- **İbn Fâris, Ahmed b. Fâris b. Zekeriyyâ (ö. 395/1004).** *Mu'cemü Makâyîsi'l-Lüğa*. Tahkik: Abdüsselâm Muhammed Hârûn. 6 Cilt. Beyrut: Dârü'l-Fikr, 1399/1979.\n- **İbn Manzûr, Muhammed b. Mükerrem (ö. 711/1311).** *Lisânü'l-Arab*. 15 Cilt. Beyrut: Dârü Sâdır, 1413/1993.\n- **Râgıb el-İsfahânî, Ebü'l-Kâsım Hüseyn b. Muhammed (ö. 502/1108 [?]).** *el-Müfredât fî Garîbi'l-Kur'ân*. Tahkik: Safvân Adnân Dâvûdî. Dımaşk: Dârü'l-Kalem / Beyrut: ed-Dârü'ş-Şâmiyye, 1412/1992.\n- **Zemahşerî, Mahmûd b. Ömer (ö. 538/1144).** *el-Keşşâf 'an Hakâ'ikı Gavâmizi't-Tenzîl ve 'Uyûni'l-Ekâvîl fî Vucûhi't-Te'vîl*. Tahkik: Âdil Ahmed Abdülmevcûd, Ali Muhammed Muavvaz. 6 Cilt. Riyad: Mektebetü'l-Ubeykân, 1418/1998.\n\n#### B) Çağdaş Kurumsal, Hukuki ve Ampirik Kaynaklar (APA 7 / DOI Standartlı)\n- **Türkiye İstatistik Kurumu [TÜİK] (2 80674276597, erişim 15 Ekim 2026, https://wir2024.wid.world.\n\n### Z-5: BAĞIMSIZ DIŞ AKADEMİK HAKEM İNCELEME FORMU\n\n```yaml\nhakem_degerlendirme_protokolu:\n  rapor_id: \"GEM-RAPOR-2026-012\"\n  sure_ayet: \"Haşr 59:7\"\n  tarih: \"2026-10-15\"\n  status: \"PRE-RELEASE\"\n  hakem_atamasi:\n    atanan_hakem: \"—\"\n    orcid: \"—\"\n    kurum: \"—\"\n    uzmanlik_alani: \"İslam İktisadı / Kamu Maliyesi ve Sosyal Adalet\"\n  rubrik_puanlamasi:\n    boyut_1_metin_ve_tahkik: \"— / 20\"\n    boyut_2_sosyo_politik_ve_kriz_analizi: \"— / 20\"\n    boyut_3_dil_guvenligi_ve_tarafsizlik: \"— / 20\"\n    boyut_4_falsifiabilite_ve_hume_giyotini: \"— / 20\"\n    boyut_5_kurumsal_tasarim_ve_ozgunluk: \"— / 20\"\n    toplam_skor: \"— / 100\"\n  hakem_karari: \"PENDING_EXTERNAL_REVIEW\"\n  derkenar_notu: \"Rapor GEM v6.1.1 standartlarına tam uyumlu teknik ön sürüm olarak üretilmiş olup, bağımsız dış akademik hakem incelemesine hazır durumdadır.\"\n```"}, {"filename": "15-rapor-rum-3022-v6.1.1.md", "case_id": "GEM-RAPOR-2026-013", "surah": "Rûm", "verse": "30:22", "topic": "Ontolojik Çoğulculuk, Dilsel ve Etnik Çeşitlilik, Asimilasyon Karşıtlığı ve Çok Kültürlü Bir Arada Yaşama Mimarisi", "date": "2026-10-15", "confidence": "B", "status": "PRE-RELEASE", "sha256": "eba0554e76a89ca6c5ba7296bea1c752887bdf456fb314638432218686f16fee", "classical_sources": [{"id": "src-zemahseri", "author": "Zemahşerî, Mahmûd b. Ömer", "death_year": "ö. 538/1144", "work": "el-Keşşâf 'an Hakâ'ikı Gavâmizi't-Tenzîl", "editor": "Âdil Ahmed Abdülmevcûd, Ali Muhammed Muavvaz", "publisher": "Mektebetü'l-Ubeykân", "publication_place": "Riyad", "publication_year": 1998, "volume": "4", "pages": "445-450", "arabic_quote": "واختلاف ألسنتكم وألوانكم: اختلاف لغاتكم من عربية وفارسية ورومية... واختلاف نغماتكم حتى لا يشتبه صوت بصوت، واختلاف صوركم وهيئاتكم وألوان بياضكم وسوادكم، مع كونكم بنين لرجل واحد وأم واحدة، وذلك دليل قاطع على قدرة الصانع الحكيم وتفرده", "verification_link": "https://archive.org/details/kashshaf-u
